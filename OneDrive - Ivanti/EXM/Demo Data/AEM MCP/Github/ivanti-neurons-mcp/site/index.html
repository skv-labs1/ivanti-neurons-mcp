<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Environment Configuration - Ivanti Neurons MCP</title>
  <style>
    :root {
      --ivanti-red: #E31837;
      --dark: #1a1a2e;
      --dark2: #16213e;
      --light: #f0f0f5;
      --white: #ffffff;
      --gray: #6c757d;
      --green: #28a745;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--dark);
      color: var(--white);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, var(--dark), var(--dark2));
      border-bottom: 3px solid var(--ivanti-red);
      padding: 2rem;
      text-align: center;
    }
    .header h1 { font-size: 2rem; margin-bottom: 0.25rem; }
    .header h1 span { color: var(--ivanti-red); }
    .header p { color: var(--gray); font-size: 0.95rem; margin-top: 0.5rem; }
    .header .endpoint {
      margin-top: 1rem;
      background: rgba(255,255,255,0.05);
      display: inline-block;
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.95rem;
      color: var(--green);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .container { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
 background: var(--green);
      color: var(--white);
    }
    .btn-success:hover {
      background: #218838;
      transform: translateY(-2px);
    }
    .btn-danger {
      background: #dc3545;
      color: var(--white);
    }
    .btn-danger:hover {
      background: #c82333;
      transform: translateY(-2px);
    }
    .alert {
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      border-left: 4px solid;
    }
    .alert-success {
      background: rgba(40, 167, 69, 0.1);
      border-left-color: var(--green);
      color: #d4edda;
    }
    .alert-error {
      background: rgba(220, 53, 69, 0.1);
      border-left-color: #dc3545;
      color: #f8d7da;
    }
    .alert-info {
      background: rgba(23, 162, 184, 0.1);
      border-left-color: #17a2b8;
      color: #d1ecf1;
    }
    .env-list {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 1rem;
      margin-top: 1.5rem;
      max-height: 300px;
      overflow-y: auto;
    }
    .env-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      margin-bottom: 0.5rem;
      font-family: monospace;
      font-size: 0.9rem;
    }
    .env-item:last-child { margin-bottom: 0; }
    .env-key {
      color: var(--green);
      font-weight: 600;
    }
    .env-value {
      color: var(--gray);
      word-break: break-all;
      flex: 1;
      margin: 0 1rem;
    }
    .env-value.hidden {
      filter: blur(5px);
      user-select: none;
    }
    .btn-small {
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
    }
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      border-bottom: 2px solid rgba(255,255,255,0.1);
    }
    .tab-btn {
      padding: 0.75rem 1.5rem;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--gray);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      color: var(--light);
    }
    .tab-btn.active {
      color: var(--ivanti-red);
      border-bottom-color: var(--ivanti-red);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .field-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 600px) {
      .field-group { grid-template-columns: 1fr; }
      .button-group { flex-direction: column; }
      button { width: 100%; }
      .header h1 { font-size: 1.5rem; }
    }
    .status-bar {
      display: flex; gap: 1rem; flex-wrap: wrap;
      justify-content: center; margin-bottom: 2rem;
    }
    .badge {
      padding: 0.35rem 1rem; border-radius: 20px;
      font-size: 0.8rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge.ok   { background: var(--green); color: var(--white); }
    .badge.off  { background: var(--gray);  color: var(--white); }
    .badge.load { background: #ffc107;      color: var(--dark); }

    /* Sections */
    .section { margin-bottom: 1.5rem; }
    .section-header {
      background: rgba(255,255,255,0.06);
      padding: 0.75rem 1rem;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.08);
      transition: background 0.2s;
    }
    .section-header:hover { background: rgba(255,255,255,0.1); }
    .section-header h3 { font-size: 1rem; }
    .section-header .count { color: var(--gray); font-size: 0.85rem; }
    .section-header .arrow { transition: transform 0.3s; }
    .section-header.open .arrow { transform: rotate(90deg); }
    .section-body {
      display: none;
      border: 1px solid rgba(255,255,255,0.08);
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.03);
    }
    .section-body.open { display: block; }
    .tool-item {
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .tool-item:last-child { border-bottom: none; }
    .tool-name { font-family: monospace; color: var(--ivanti-red); font-weight: 600; font-size: 0.9rem; }
    .tool-desc { color: var(--gray); font-size: 0.85rem; margin-top: 0.15rem; }

    /* Setup */
    h2 { font-size: 1.25rem; margin: 2rem 0 1rem; color: var(--ivanti-red); }
    pre {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
      font-size: 0.85rem;
      line-height: 1.5;
      color: #c9d1d9;
    }
    code { font-family: "SF Mono", "Fira Code", monospace; }

    /* Test panel */
    .test-panel {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 1.25rem;
      margin-top: 1rem;
    }
    .test-panel label { font-size: 0.85rem; color: var(--gray); display: block; margin-bottom: 0.3rem; }
    .test-panel select, .test-panel textarea, .test-panel button {
      width: 100%;
      font-family: monospace;
      font-size: 0.85rem;
      padding: 0.5rem;
      margin-bottom: 0.75rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: var(--white);
    }
    .test-panel textarea { min-height: 60px; resize: vertical; }
    .test-panel button {
      background: var(--ivanti-red);
      border: none;
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: opacity 0.2s;
    }
    .test-panel button:hover { opacity: 0.85; }
    #testResult {
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><span>Ivanti Neurons</span> MCP Server</h1>
    <div class="version">v1.0.0 &bull; MCP Protocol 2025-03-26</div>
    <div class="endpoint" id="endpoint">loading…</div>
  </div>

  <div class="container">
    <!-- Module status badges -->
    <div class="status-bar" id="statusBar">
      <span class="badge load" id="badgeDex">DEX …</span>
      <span class="badge load" id="badgeItsm">ITSM …</span>
      <span class="badge load" id="badgeMdm">MDM …</span>
    </div>

    <!-- Tool sections (populated by JS) -->
    <div id="toolSections"></div>

    <!-- Setup instructions -->
    <h2>🔧 Claude Desktop Config</h2>
    <pre><code id="claudeConfig"></code></pre>

    <h2>🆚 VS Code / Continue Config</h2>
    <pre><code id="vscodeConfig"></code></pre>

    <!-- Test panel -->
    <h2>🧪 Test Panel</h2>
    <div class="test-panel">
      <label>Tool</label>
      <select id="toolSelect"><option value="">– loading –</option></select>
      <label>Arguments (JSON)</label>
      <textarea id="toolArgs">{}</textarea>
      <button id="runBtn" onclick="runTest()">▶ Run Tool</button>
      <pre id="testResult" style="min-height:60px;color:#c9d1d9;">Response will appear here…</pre>
    </div>
  </div>

  <script>
    const mcpUrl = `${location.origin}/api/mcp`;
    document.getElementById("endpoint").textContent = mcpUrl;

    const modules = { dex: "dex_", itsm: "itsm_", mdm: "mdm_" };
    let allTools = [];

    async function init() {
      try {
        const res = await fetch(mcpUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/list" }),
        });
        const data = await res.json();
        allTools = data.result?.tools || [];
      } catch (e) {
        allTools = [];
      }

      // Status badges
      for (const [mod, prefix] of Object.entries(modules)) {
        const badge = document.getElementById(`badge${mod.charAt(0).toUpperCase()+mod.slice(1)}`);
        const count = allTools.filter(t => t.name.startsWith(prefix)).length;
        badge.textContent = `${mod.toUpperCase()} — ${count} tools`;
        badge.className = count > 0 ? "badge ok" : "badge off";
      }

      // Tool sections
      const container = document.getElementById("toolSections");
      const groups = [
        { label: "DEX — Neurons Platform", prefix: "dex_", color: "#28a745" },
        { label: "ITSM — Service Management", prefix: "itsm_", color: "#ffc107" },
        { label: "MDM — Mobile Device Management", prefix: "mdm_", color: "#17a2b8" },
      ];
      for (const g of groups) {
        const tools = allTools.filter(t => t.name.startsWith(g.prefix));
        const sec = document.createElement("div");
        sec.className = "section";
        sec.innerHTML = `
          <div class="section-header" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
            <h3>${g.label}</h3>
            <span class="count">${tools.length} tools &nbsp;▶</span>
          </div>
          <div class="section-body">
            ${tools.map(t => `<div class="tool-item"><div class="tool-name">${t.name}</div><div class="tool-desc">${t.description}</div></div>`).join("")}
          </div>`;
        container.appendChild(sec);
      }

      // Populate test select
      const sel = document.getElementById("toolSelect");
      sel.innerHTML = `<option value="">— select a tool —</option>` +
        allTools.map(t => `<option value="${t.name}">${t.name}</option>`).join("");

      // Config snippets
      document.getElementById("claudeConfig").textContent = JSON.stringify({
        mcpServers: {
          "ivanti-neurons": {
            transport: "http",
            url: mcpUrl,
        Environment <span>Configuration</span></h1>
    <p>Manage your environment variables for this session</p>
  </div>

  <div class="container">
    <div id="alertContainer"></div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('input-tab')">Input Variables</button>
      <button class="tab-btn" onclick="switchTab('view-tab')">View/Export</button>
    </div>

    <!-- Input Tab -->
    <div id="input-tab" class="tab-content active">
      <div class="form-section">
        <h2>Add Environment Variables</h2>
        
        <div class="form-group">
          <label for="varKey">Variable Name</label>
          <input type="text" id="varKey" placeholder="e.g., API_KEY, DATABASE_URL" />
          <p class="label-hint">The name of the environment variable</p>
        </div>

        <div class="form-group">
          <label for="varValue">Variable Value</label>
          <input type="password" id="varValue" placeholder="Enter the value" />
          <div class="checkbox-group">
            <input type="checkbox" id="showValue" />
            <label for="showValue" style="margin-bottom: 0;">Show value</label>
          </div>
        </div>

        <div class="button-group">
          <button class="btn-primary" onclick="addVariable()">Add Variable</button>
          <button class="btn-secondary" onclick="clearForm()">Clear Form</button>
        </div>

        <h2 style="margin-top: 2rem;">Predefined Templates</h2>
        <p class="label-hint" style="margin-bottom: 1rem;">Quickly load common environment variable sets</p>
        
        <div class="field-group">
          <button class="btn-secondary" onclick="loadTemplate('ivanti')">Load Ivanti Config</button>
          <button class="btn-secondary" onclick="loadTemplate('api')">Load API Config</button>
          <button class="btn-secondary" onclick="loadTemplate('database')">Load Database Config</button>
          <button class="btn-secondary" onclick="loadTemplate('auth')">Load Auth Config</button>
        </div>
      </div>
    </div>

    <!-- View/Export Tab -->
    <div id="view-tab" class="tab-content">
      <div class="form-section">
        <h2>Current Environment Variables</h2>
        
        <div id="envListContainer" class="env-list">
          <p style="color: var(--gray); text-align: center;">No variables loaded yet</p>
        </div>

        <div class="button-group" style="margin-top: 1.5rem;">
          <button class="btn-success" onclick="exportAsJSON()">Export as JSON</button>
          <button class="btn-success" onclick="exportAsENV()">Export as .env</button>
          <button class="btn-secondary" onclick="copyToClipboard()">Copy to Clipboard</button>
          <button class="btn-danger" onclick="clearAllVariables()">Clear All</button>
        </div>

        <div style="margin-top: 2rem;">
          <h3 style="color: var(--ivanti-red); margin-bottom: 1rem;">Export Preview</h3>
          <textarea id="exportPreview" readonly style="height: 200px; resize: vertical;"></textarea>
          <p class="label-hint" style="margin-top: 0.5rem;">Copy the content above to use in your application</p>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <div style="text-align: center; margin-top: 2rem; padding: 1.5rem 0; border-top: 2px solid rgba(255,255,255,0.1);">
      <button class="btn-primary" onclick="continueToMCP()" style="padding: 0.9rem 2rem; font-size: 1rem;">
        Continue to MCP Server →
      </button>
      <p class="label-hint" style="margin-top: 1rem;">Configure your variables above, then proceed to access the MCP tools</p>
    </div>
  </div>

  <script>
    // Load variables from localStorage
    function loadVariables() {
      const stored = localStorage.getItem('envVariables');
      return stored ? JSON.parse(stored) : {};
    }

    // Save variables to localStorage
    function saveVariables(vars) {
      localStorage.setItem('envVariables', JSON.stringify(vars));
      updateDisplay();
    }

    // Add a new variable
    function addVariable() {
      const key = document.getElementById('varKey').value.trim();
      const value = document.getElementById('varValue').value;

      if (!key) {
        showAlert('Please enter a variable name', 'error');
        return;
      }

      if (!value) {
        showAlert('Please enter a variable value', 'error');
        return;
      }

      const vars = loadVariables();
      vars[key] = value;
      saveVariables(vars);
      showAlert(`Variable "${key}" added successfully`, 'success');
      clearForm();
    }

    // Clear form inputs
    function clearForm() {
      document.getElementById('varKey').value = '';
      document.getElementById('varValue').value = '';
      document.getElementById('showValue').checked = false;
      updatePasswordInput();
    }

    // Load predefined template
    function loadTemplate(template) {
      let variables = {};

      switch(template) {
        case 'ivanti':
          variables = {
            'IVANTI_API_URL': 'https://api.ivanti.com',
            'IVANTI_API_KEY': '',
            'IVANTI_TENANT_ID': '',
            'IVANTI_USERNAME': '',
            'IVANTI_PASSWORD': ''
          };
          break;
        case 'api':
          variables = {
            'API_BASE_URL': 'http://localhost:3000',
            'API_KEY': '',
            'API_SECRET': '',
            'API_TIMEOUT': '30000'
          };
          break;
        case 'database':
          variables = {
            'DB_HOST': 'localhost',
            'DB_PORT': '5432',
            'DB_USER': '',
            'DB_PASSWORD': '',
            'DB_NAME': 'myapp',
            'DB_URL': ''
          };
          break;
        case 'auth':
          variables = {
            'AUTH_TOKEN': '',
            'AUTH_SECRET': '',
            'AUTH_EXPIRES_IN': '3600',
            'OAUTH_CLIENT_ID': '',
            'OAUTH_CLIENT_SECRET': ''
          };
          break;
      }

      const current = loadVariables();
      const merged = { ...current, ...variables };
      saveVariables(merged);
      showAlert(`Template "${template}" loaded and merged`, 'success');
    }

    // Update display
    function updateDisplay() {
      const vars = loadVariables();
      const container = document.getElementById('envListContainer');

      if (Object.keys(vars).length === 0) {
        container.innerHTML = '<p style="color: var(--gray); text-align: center;">No variables loaded yet</p>';
        updateExportPreview({});
        return;
      }

      let html = '';
      Object.entries(vars).forEach(([key, value]) => {
        const isHidden = !document.getElementById('showValue')?.checked;
        const displayValue = isHidden ? '••••••••' : value;
        html += `
          <div class="env-item">
            <span class="env-key">${escapeHtml(key)}</span>
            <span class="env-value">${escapeHtml(displayValue)}</span>
            <button class="btn-secondary btn-small" onclick="copyValue('${key}')">Copy</button>
            <button class="btn-danger btn-small" onclick="deleteVariable('${key}')">Delete</button>
          </div>
        `;
      });
      container.innerHTML = html;
      updateExportPreview(vars);
    }

    // Update export preview
    function updateExportPreview(vars) {
      const preview = document.getElementById('exportPreview');
      preview.value = Object.entries(vars)
        .map(([k, v]) => `${k}=${v}`)
        .join('\n');
    }

    // Delete a variable
    function deleteVariable(key) {
      if (confirm(`Delete variable "${key}"?`)) {
        const vars = loadVariables();
        delete vars[key];
        saveVariables(vars);
        showAlert(`Variable "${key}" deleted`, 'success');
      }
    }

    // Clear all variables
    function clearAllVariables() {
      if (confirm('Are you sure you want to delete all environment variables? This cannot be undone.')) {
        localStorage.removeItem('envVariables');
        updateDisplay();
        showAlert('All variables cleared', 'success');
      }
    }

    // Export as JSON
    function exportAsJSON() {
      const vars = loadVariables();
      const json = JSON.stringify(vars, null, 2);
      downloadFile(json, 'env-variables.json', 'application/json');
    }

    // Export as .env file
    function exportAsENV() {
      const vars = loadVariables();
      const env = Object.entries(vars)
        .map(([k, v]) => `${k}=${v}`)
        .join('\n');
      downloadFile(env, '.env', 'text/plain');
    }

    // Copy to clipboard
    function copyToClipboard() {
      const preview = document.getElementById('exportPreview');
      preview.select();
      document.execCommand('copy');
      showAlert('Copied to clipboard', 'success');
    }

    // Copy individual value
    function copyValue(key) {
      const vars = loadVariables();
      const value = vars[key];
      navigator.clipboard.writeText(value).then(() => {
        showAlert(`Copied "${key}" to clipboard`, 'success');
      });
    }

    // Download file
    function downloadFile(content, filename, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Switch tabs
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    // Show alert
    function showAlert(message, type = 'info') {
      const container = document.getElementById('alertContainer');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      container.appendChild(alert);
      setTimeout(() => alert.remove(), 4000);
    }

    // Escape HTML
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Toggle password visibility
    function updatePasswordInput() {
      const input = document.getElementById('varValue');
      const checkbox = document.getElementById('showValue');
      input.type = checkbox.checked ? 'text' : 'password';
    }

    // Continue to MCP
    function continueToMCP() {
      const vars = loadVariables();
      if (Object.keys(vars).length === 0) {
        showAlert('Please add at least one environment variable before continuing', 'error');
        return;
      }
      window.location.href = '/mcp.html';
    }

    // Event listeners
    document.getElementById('showValue').addEventListener('change', updatePasswordInput);

    // Initialize
    updateDisplay
